[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npa-json-agent"
version = "1.0.0"
description = "Agent for applying NPA amendments to target NPA JSON documents"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["npa_processor*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["npa_processor", "scripts"]

[tool.black]
line-length = 120
target-version = ["py310"]
