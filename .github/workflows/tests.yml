name: tests

on:
  push:
    branches: ["master", "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check npa_processor scripts tests
